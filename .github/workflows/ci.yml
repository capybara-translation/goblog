name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # static.go embeds web-admin/dist (gitignored build output), so the
      # admin SPA must be built before any go command can compile the tree.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - name: build admin SPA (required by go:embed)
        working-directory: web-admin
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v node_modules || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - name: npm ci
        run: npm ci
      - name: type check
        run: npx tsc --noEmit
      - name: vitest
        run: npx vitest run
      - name: build
        run: npm run build
