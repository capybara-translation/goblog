# goblog nginx configuration
# Place this file in /etc/nginx/sites-available/goblog
# Then create a symlink: ln -s /etc/nginx/sites-available/goblog /etc/nginx/sites-enabled/
#
# After placing this file, run:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.com
#
# Certbot will automatically add SSL configuration to this file.

# Upstream configuration
upstream goblog {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP server (certbot will add SSL and redirect)
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Logging
    access_log /var/log/nginx/goblog_access.log;
    error_log /var/log/nginx/goblog_error.log;

    # Max upload size (for image uploads)
    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Admin SPA assets caching
    location /admin/assets/ {
        proxy_pass http://goblog;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy to goblog
    location / {
        proxy_pass http://goblog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check endpoint (optional: restrict to localhost)
    location /api/v1/health {
        proxy_pass http://goblog;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # allow 127.0.0.1;
        # deny all;
    }
}
