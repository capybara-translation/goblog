{{- define "notfound" -}}
{{template "layout" .}}
{{- end -}}

{{define "title"}}ページが見つかりません - {{.SiteTitle}}{{end}}

{{define "content"}}
<div class="flex flex-col items-center justify-center py-16 text-center">
    <div class="text-8xl font-sans font-bold text-primary-300 mb-4">404</div>
    <h2 class="text-2xl font-sans font-bold text-primary-900 mb-4">ページが見つかりません</h2>
    <p class="text-primary-600 mb-8 max-w-md">
        お探しのページは存在しないか、移動された可能性があります。
    </p>
    <div class="flex gap-4">
        <a href="/" class="inline-flex items-center px-6 py-3 bg-primary-900 text-white font-sans font-medium rounded-lg hover:bg-primary-800 transition-colors duration-200">
            ホームに戻る
        </a>
        <a href="/posts" class="inline-flex items-center px-6 py-3 bg-white border border-primary-300 text-primary-700 font-sans font-medium rounded-lg hover:bg-primary-50 transition-colors duration-200">
            記事一覧へ
        </a>
    </div>
</div>
{{end}}
