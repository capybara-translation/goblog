{{- define "layout" -}}
<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}{{.SiteTitle}}{{end}}</title>
    <link rel="icon" type="image/svg+xml" href="/static/pencil.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f8f9fa',
                            100: '#f1f3f5',
                            200: '#e9ecef',
                            300: '#dee2e6',
                            400: '#ced4da',
                            500: '#adb5bd',
                            600: '#868e96',
                            700: '#495057',
                            800: '#343a40',
                            900: '#212529',
                        }
                    },
                    fontFamily: {
                        'serif': ['"Noto Serif JP"', 'Georgia', 'serif'],
                        'sans': ['"Noto Sans JP"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply font-serif text-primary-800 antialiased;
            }
        }
    </style>
</head>
<body class="bg-stone-50 min-h-screen flex flex-col">
    <header class="bg-white border-b border-stone-200">
        <div class="max-w-3xl mx-auto px-6 py-8">
            <h1 class="text-3xl font-sans font-bold mb-4 tracking-tight">
                <a href="/" class="text-primary-900 hover:text-primary-700 transition-colors duration-200">{{.SiteTitle}}</a>
            </h1>
            <nav class="font-sans text-sm">
                <a href="/" class="text-primary-600 hover:text-primary-900 transition-colors duration-200 mr-6">ホーム</a>
                <a href="/posts" class="text-primary-600 hover:text-primary-900 transition-colors duration-200 mr-6">記事一覧</a>
                <a href="/tags" class="text-primary-600 hover:text-primary-900 transition-colors duration-200">タグ</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow">
        <div class="max-w-3xl mx-auto px-6 py-12">
            {{block "content" .}}{{end}}
        </div>
    </main>

    <footer class="bg-white border-t border-stone-200 mt-auto">
        <div class="max-w-3xl mx-auto px-6 py-8">
            <p class="text-center text-sm text-primary-500 font-sans">&copy; 2025 {{.SiteTitle}}. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
{{- end -}}
