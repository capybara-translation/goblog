{{- define "layout" -}}
<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}{{.SiteTitle}}{{end}}</title>
    <link rel="icon" type="image/svg+xml" href="/static/pencil.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#18181b',
                            100: '#27272a',
                            200: '#3f3f46',
                            300: '#52525b',
                            400: '#71717a',
                            500: '#a1a1aa',
                            600: '#d4d4d8',
                            700: '#e4e4e7',
                            800: '#f4f4f5',
                            900: '#fafafa',
                        }
                    },
                    fontFamily: {
                        'serif': ['"Noto Serif JP"', 'Georgia', 'serif'],
                        'sans': ['"Noto Sans JP"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply font-sans text-primary-600 antialiased text-sm;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/markdown.css">
</head>
<body class="bg-primary-50 min-h-screen flex flex-col">
    <header class="bg-primary-100 border-b border-primary-200">
        <div class="max-w-2xl mx-auto px-4 py-6">
            <h1 class="text-2xl font-sans font-bold tracking-tight">
                <a href="/" class="text-primary-800 hover:text-primary-900 transition-colors duration-200">{{.SiteTitle}}</a>
            </h1>
            <nav class="font-sans text-sm mt-2 text-primary-500 flex flex-wrap gap-4">
                <a href="/posts" class="hover:text-primary-700 transition-colors duration-200">記事一覧</a>
                <a href="/tags" class="hover:text-primary-700 transition-colors duration-200">タグ</a>
                {{range .PinnedPosts}}<a href="/posts/{{.Slug}}" class="hover:text-primary-700 transition-colors duration-200">{{.Title}}</a>{{end}}
            </nav>
        </div>
    </header>

    <main class="flex-grow">
        <div class="max-w-2xl mx-auto px-4 py-8">
            {{block "content" .}}{{end}}
        </div>
    </main>

    <footer class="bg-primary-100 border-t border-primary-200 mt-auto">
        <div class="max-w-2xl mx-auto px-4 py-6">
            <p class="text-center text-sm text-primary-400 font-sans">&copy; 2025 {{.SiteTitle}}</p>
        </div>
    </footer>
</body>
</html>
{{- end -}}
